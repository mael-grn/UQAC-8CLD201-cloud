# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool: "Pipelines TP2"

variables:
  - name: resourceGroupName
    value: 'TP2-CLOUD'
  - name: rgLocation
    value: 'Canada Central'
    # Project folder name for the Infrastructure
  - name: AzureAppInfrastructure
    value: 'TP2_InfrastructureBlob'
    # Project folder name for the Azure blob Function
  - name: AzureAppFunctionBlob
    value: 'TP2_BlobFunction'
        # Project folder name for the Azure queue Function
  - name: AzureAppFunctionQueue
    value: 'TP2_SBFunction'
    # Name of the Infrastructure Resource (Blob)
  - name: AzureBlob
    value: 'blobfunctiontp2'
  - name: AzureFunctionAppName
    value: 'TP2FunctionApp1'
  - name: BlobString
    value: 'carotte'
  - name: AZP_AGENT_CLEANUP_PSMODULES_IN_POWERSHELL
    value: 'true'


stages:
- stage: Infra
  displayName: Infrastructure Deployment
  jobs:
  - job: Deploy
    displayName: Infrastructure Deployment
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: ARM Template Deployment
      name: ARMdeploy
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: 'Azure subscription TP Cloud(60802648-40a5-4ac4-bfd8-4552de815888)'
        subscriptionId: '60802648-40a5-4ac4-bfd8-4552de815888'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(rgLocation)'
        templateLocation: 'Linked artifact'
        csmFile: '$(Build.SourcesDirectory)\$(AzureAppInfrastructure)\azuredeploy.json'
        csmParametersFile: '$(Build.SourcesDirectory)\$(AzureAppInfrastructure)\azuredeploy.parameters.json'
        deploymentMode: 'Incremental'
        deploymentOutputs: 'Deployment1'
        
    - script: |
        echo ##vso[task.setvariable variable=BlobString;isOutput=true;isSecure=false]$(Deployment1.blobstoragestring.value)
      name: AssignKey

- stage: FuncDep
  displayName: Function Appp Deployment
  jobs:
  - job: Deploy
    displayName: Function Appp Deployment
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: 'Azure subscription TP Cloud(60802648-40a5-4ac4-bfd8-4552de815888)'
        subscriptionId: '60802648-40a5-4ac4-bfd8-4552de815888'
        action: 'Create Or Update Resource Group'
        resourceGroupName: 'TP2-cloud'
        location: 'Canada Central'
        templateLocation: 'Linked artifact'
        csmFile: '$(Build.SourcesDirectory)\TP2_FunctionAppDeployment\azuredeploy.json'
        csmParametersFile: '$(Build.SourcesDirectory)\TP2_FunctionAppDeployment\azuredeploy.parameters.json'
        deploymentMode: 'Incremental'


- stage: FunctionBlob
  displayName: Blob Triggered Function Deployment

  jobs:
  - job: FunctionBuild
    displayName: Function Build

    steps:
    - task: DotNetCoreCLI@2
      displayName: Restore Project
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunctionBlob)/*.csproj'
        
    - task: DotNetCoreCLI@2
      displayName: Build Azure Function
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunctionBlob)/*.csproj'
        arguments: '--configuration Release --output $(Build.BinariesDirectory)'

    - task: DotNetCoreCLI@2
      displayName: Publish Azure Function
      inputs:
        command: 'publish'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunctionBlob)/*.csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        publishWebProjects: false
        zipAfterPublish: true
        modifyOutputPath: false
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

  - job: FunctionDeploy
    displayName: Function Deployment
    dependsOn: FunctionBuild

    variables: 
      blobstring: $[ stageDependencies.Infra.Deploy.outputs['AssignKey.BlobString'] ]

    steps:
    - checkout: none
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
        cleanDestinationFolder: true

    - task: AzureFunctionApp@2
      inputs:
        connectedServiceNameARM: 'Azure subscription TP Cloud(60802648-40a5-4ac4-bfd8-4552de815888)'
        appType: 'functionApp'
        appName: '$(AzureFunctionAppName)'
        deployToSlotOrASE: true
        resourceGroupName: '$(resourceGroupName)'
        slotName: 'production'
        package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
        deploymentMethod: 'runFromPackage'
        appSettings: '-ConnectionString $(blobstring) -ConnectionString__blob "https://$(AzureBlob).blob.core.windows.net/"'

- stage: FunctionQueue
  displayName: Queue Triggered Function Deployment

  jobs:
  - job: FunctionBuild
    displayName: Function Build

    steps:
    - task: DotNetCoreCLI@2
      displayName: Restore Project
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunctionQueue)/*.csproj'
        
    - task: DotNetCoreCLI@2
      displayName: Build Azure Function
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunctionQueue)/*.csproj'
        arguments: '--configuration Release --output $(Build.BinariesDirectory)'

    - task: DotNetCoreCLI@2
      displayName: Publish Azure Function
      inputs:
        command: 'publish'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunctionQueue)/*.csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        publishWebProjects: false
        zipAfterPublish: true
        modifyOutputPath: false
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

  - job: FunctionDeploy
    displayName: Function Deployment
    dependsOn: FunctionBuild

    steps:
    - checkout: none
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
        cleanDestinationFolder: true

    - task: AzureFunctionApp@2
      inputs:
        connectedServiceNameARM: 'Azure subscription TP Cloud(60802648-40a5-4ac4-bfd8-4552de815888)'
        appType: 'functionApp'
        appName: '$(AzureFunctionAppName)'
        deployToSlotOrASE: true
        resourceGroupName: '$(resourceGroupName)'
        slotName: 'production'
        package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
        deploymentMethod: 'runFromPackage'
        appSettings: '-ConnectionString $(QueueString)'