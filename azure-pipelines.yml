trigger:
- master

pool: "Pipelines TP2" # Vous pouvez essayer avec un agent hébergé pour voir si le problème persiste (vmImage: 'windows-latest')

variables:
  - name: resourceGroupName
    value: 'TP2-CLOUD'
  - name: rgLocation
    value: 'Canada Central'
  - name: AzureAppInfrastructure
    value: 'TP2_InfrastructureBlob'
  - name: AzureAppFunction
    value: 'TP2_BlobFunction'
  - name: AzureBlob
    value: 'blobfunctiontp2'
  - name: AzureFunctionAppName
    value: 'TP2FunctionApp'

stages:
- stage: Infra
  displayName: Infrastructure Deployment
  jobs:
  - job: Deploy
    displayName: Infrastructure Deployment
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: ARM Template Deployment
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: 'Azure subscription TP Cloud(60802648-40a5-4ac4-bfd8-4552de815888)'
        subscriptionId: '60802648-40a5-4ac4-bfd8-4552de815888'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(rgLocation)'
        templateLocation: 'Linked artifact'
        csmFile: '$(Build.SourcesDirectory)\$(AzureAppInfrastructure)\azuredeploy.json'
        csmParametersFile: '$(Build.SourcesDirectory)\$(AzureAppInfrastructure)\azuredeploy.parameters.json'
        deploymentMode: 'Incremental'
        # Supprimez deploymentOutputs car nous n'en avons pas besoin pour la démo
        # deploymentOutputs: 'Deployment1'

    # Supprimez la tâche script car nous n'avons plus besoin de la variable BlobString
    # - script: |
    #     echo ##vso[task.setvariable variable=BlobString;isOutput=true;isSecure=false]$(Deployment1.blobstoragestring.value)
    #   name: AssignKey

- stage: Function
  displayName: Function Deployment
  jobs:
  - job: FunctionBuild
    displayName: Function Build
    steps:
    - task: DotNetCoreCLI@2
      displayName: Restore Project
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunction)/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build Azure Function
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunction)/*.csproj'
        arguments: '--configuration Release --output $(Build.BinariesDirectory)'

    - task: DotNetCoreCLI@2
      displayName: Publish Azure Function
      inputs:
        command: 'publish'
        projects: '$(Build.SourcesDirectory)/$(AzureAppFunction)/*.csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        publishWebProjects: false
        zipAfterPublish: true
        modifyOutputPath: false

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

  - job: FunctionDeploy
    displayName: Function Deployment
    dependsOn: FunctionBuild
    steps:
    - checkout: none
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
        cleanDestinationFolder: true

    - task: AzureFunctionApp@2
      inputs:
        connectedServiceNameARM: 'Azure subscription TP Cloud(60802648-40a5-4ac4-bfd8-4552de815888)'
        appType: 'functionApp'
        appName: '$(AzureFunctionAppName)'
        deployToSlotOrASE: true
        resourceGroupName: '$(resourceGroupName)'
        slotName: 'production'
        package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
        deploymentMethod: 'runFromPackage'
        # Simplifiez appSettings pour la démo :
        appSettings: '-WEBSITE_RUN_FROM_PACKAGE 1'